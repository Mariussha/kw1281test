# Push a tag like v1.0.4-gui.1 to build kw1281test-gui.exe + kw1281test.exe and publish them as a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test kw1281test.slnx
      - run: dotnet publish Gui/kw1281test-gui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - run: Compress-Archive -Path publish/kw1281test-gui.exe, publish/kw1281test.exe -DestinationPath kw1281test_${{ github.ref_name }}_Win-x64.zip
      - run: gh release create "${{ github.ref_name }}" "kw1281test_${{ github.ref_name }}_Win-x64.zip" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
