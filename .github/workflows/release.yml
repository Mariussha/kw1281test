# Publish a release on GitHub (Releases -> Draft a new release, target this branch) and this builds
# kw1281test-gui.exe + kw1281test.exe on Windows and attaches them to it as a zip.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      BODY: ${{ github.event.release.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test kw1281test.slnx
      - run: dotnet publish Gui/kw1281test-gui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - run: Compress-Archive -Path publish/kw1281test-gui.exe, publish/kw1281test.exe -DestinationPath "kw1281test_$($env:TAG)_Win-x64.zip"
      - run: gh release upload $env:TAG "kw1281test_$($env:TAG)_Win-x64.zip" --clobber --repo "${{ github.repository }}"
      # Fill in the notes only if the release was published without any.
      - run: if (-not $env:BODY) { gh release edit $env:TAG --notes-file .github/release-notes.md --repo "${{ github.repository }}" }
